[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olympics-analytics-platform"
version = "1.0.0"
description = "Olympics data quality, statistics, SQL analytics, forecasting, medal-prediction model, API and dashboard"
requires-python = ">=3.10"
readme = "README.md"

[project.scripts]
olympics = "olympics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
olympics = ["sql/queries/*.sql"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E701", "E702", "E731", "B008", "B905", "I001"]
