name: CD

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/metadata-action@v5
        id: meta
        with: { images: "ghcr.io/${{ github.repository }}" }
      - uses: docker/build-push-action@v5
        with: { context: ., push: true, tags: "${{ steps.meta.outputs.tags }}", labels: "${{ steps.meta.outputs.labels }}" }
  # Deploy step is intentionally left to your platform (Cloud Run / Render / Fly / Kubernetes):
  # pull ghcr.io/<repo>:<tag> and mount the workspace (models/) volume.
